<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WTracker Mini App — финальные blueprints</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #edf1ef; color: #18211d; }
      main { width: min(100% - 32px, 1440px); margin: 0 auto; padding: 32px 0 56px; }
      h1 { margin: 0; font-size: 28px; }
      p { max-width: 760px; margin: 8px 0 28px; color: #56625c; line-height: 1.5; }
      section { margin-top: 32px; }
      h2 { margin: 0 0 14px; font-size: 18px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start; }
      figure { margin: 0; padding: 12px; border: 1px solid #d6ded9; border-radius: 8px; background: #fff; }
      img { display: block; width: min(100%, 390px); height: auto; margin: 0 auto; border: 1px solid #d6ded9; }
      figure.desktop img { width: 100%; }
      figcaption { margin-top: 10px; font-size: 13px; font-weight: 650; }
      code { font-family: ui-monospace, monospace; font-size: 12px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0c1210; color: #f2f6f4; }
        p { color: #a6b2ac; }
        figure { border-color: #34423b; background: #18211d; }
        img { border-color: #34423b; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Финальные blueprints Mini App</h1>
      <p>Выбранное направление: оболочка и экраны A, компактное кольцо КБЖУ и численная легенда из B. Это контрольный макет до переноса системы в production React/CSS.</p>

      <section>
        <h2>Рацион</h2>
        <div class="grid">
          <figure><img src="ration-light-390x844.png" alt="Рацион, светлая тема" /><figcaption><code>ration-light-390x844.png</code></figcaption></figure>
          <figure><img src="ration-dark-390x844.png" alt="Рацион, тёмная тема" /><figcaption><code>ration-dark-390x844.png</code></figcaption></figure>
        </div>
      </section>

      <section>
        <h2>Основные разделы</h2>
        <div class="grid">
          <figure><img src="food-light-390x844.png" alt="Каталог еды" /><figcaption><code>food-light-390x844.png</code></figcaption></figure>
          <figure><img src="barcode-review-light-390x844.png" alt="Проверка продукта по штрих-коду" /><figcaption><code>barcode-review-light-390x844.png</code></figcaption></figure>
          <figure><img src="weight-light-390x844.png" alt="Вес, светлая тема" /><figcaption><code>weight-light-390x844.png</code></figcaption></figure>
          <figure><img src="weight-dark-390x844.png" alt="Вес, тёмная тема" /><figcaption><code>weight-dark-390x844.png</code></figcaption></figure>
          <figure><img src="profile-light-390x844.png" alt="Профиль" /><figcaption><code>profile-light-390x844.png</code></figcaption></figure>
        </div>
      </section>

      <section>
        <h2>Desktop</h2>
        <div class="grid">
          <figure class="desktop"><img src="desktop-1280x800.png" alt="Рацион на desktop" /><figcaption><code>desktop-1280x800.png</code></figcaption></figure>
        </div>
      </section>
    </main>
  </body>
</html>
