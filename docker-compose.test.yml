name: nutrition-bot-test

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nutrition_bot_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutrition_bot_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    tmpfs:
      - /var/lib/postgresql/data

  tests:
    build:
      context: .
      target: test
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      BOT_TOKEN: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@test-db:5432/nutrition_bot_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@test-db:5432/nutrition_bot_test
    command:
      - sh
      - -c
      - >-
        ruff check --no-cache . &&
        ruff format --check --no-cache . &&
        alembic upgrade head &&
        alembic check &&
        alembic downgrade base &&
        alembic upgrade head &&
        alembic check &&
        pytest -q -p no:cacheprovider
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
