[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrition-bot"
version = "0.1.0"
description = "Telegram bot for tracking nutrition and weight"
readme = { text = "Telegram bot for tracking nutrition and weight.", content-type = "text/plain" }
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4.0",
    "alembic>=1.14,<2.0",
    "APScheduler>=3.11,<4.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "matplotlib>=3.10,<4.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "SQLAlchemy[asyncio]>=2.0.36,<3.0",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["BOT_SPEC*.md", "build"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
